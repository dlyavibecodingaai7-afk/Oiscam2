name: Build Native Camera + Transsion OIS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool wget unzip
          apktool --version

      - name: Decode APK
        run: |
          apktool d original/base.apk -o decoded -f

      - name: Apply Transsion OIS patch
        run: |
          python3 << 'PY'
          import sys

          with open("decoded/smali/M1/c0.smali", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          insert = '''
              # ============================================================
              # TRANSSION OIS - FORCE ENABLE (candidate value = 1)
              # ============================================================
              :try_start_transsion
              const-string v0, "com.transsion.tranOisMode"

              const-class v1, [I

              new-instance v2, Landroid/hardware/camera2/CaptureRequest$Key;

              invoke-direct {v2, v0, v1}, Landroid/hardware/camera2/CaptureRequest$Key;-><init>(Ljava/lang/String;Ljava/lang/Class;)V

              const/4 v0, 0x1

              new-array v0, v0, [I

              const/4 v1, 0x0

              const/4 v3, 0x1

              aput v3, v0, v1

              invoke-virtual {p1, v2, v0}, Landroidx/camera/camera2/interop/CaptureRequestOptions$Builder;->setCaptureRequestOption(Landroid/hardware/camera2/CaptureRequest$Key;Ljava/lang/Object;)Landroidx/camera/camera2/interop/CaptureRequestOptions$Builder;

              const-string v0, "RawCamManager"

              const-string v1, "Applied Transsion OIS vendor tag: tranOisMode=1"

              invoke-static {v0, v1}, Landroid/util/Log;->d(Ljava/lang/String;Ljava/lang/String;)I
              :try_end_transsion
              .catch Ljava/lang/Exception; {:try_start_transsion .. :try_end_transsion} :catch_transsion

              goto :cond_transsion_end

              :catch_transsion
              move-exception v0

              const-string v1, "RawCamManager"

              invoke-virtual {v0}, Ljava/lang/Throwable;->getMessage()Ljava/lang/String;

              move-result-object v0

              const-string v2, "Failed to apply Transsion OIS: "

              invoke-static {v2, v0, v1}, LC0/c;->s(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V

              :cond_transsion_end
              # === END TRANSSION OIS ===
          '''

          marker = "Failed to apply MTK vendor EIS tag:"
          pos = content.find(marker)
          if pos == -1:
              print("ERROR: Could not find MTK EIS marker")
              sys.exit(1)

          ret_pos = content.find("    return-void", pos)
          if ret_pos == -1:
              print("ERROR: Could not find return-void")
              sys.exit(1)

          new_content = content[:ret_pos] + insert + "\n" + content[ret_pos:]

          with open("decoded/smali/M1/c0.smali", "w", encoding="utf-8") as f:
              f.write(new_content)

          print("Patch applied successfully!")
          PY

      - name: Build APK
        run: |
          apktool b decoded -o NativeCamera_TranssionOIS_unsigned.apk

      - name: Sign APK
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar
          java -jar uber-apk-signer.jar --apks NativeCamera_TranssionOIS_unsigned.apk --debug --allowResign
          mv NativeCamera_TranssionOIS_unsigned-aligned-debugSigned.apk NativeCamera_TranssionOIS.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeCamera-TranssionOIS
          path: NativeCamera_TranssionOIS*.apk
          retention-days: 5
